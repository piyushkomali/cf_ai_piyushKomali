name = "cf-ai-shopping-list"
main = "src/worker.js"
compatibility_date = "2024-10-01"
account_id = "eee08042a2fa8dd7724d08b5e19c8bdf"

[[durable_objects.bindings]]
name = "SHOPPING_LIST"
class_name = "ShoppingList"
script_name = "cf-ai-shopping-list"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShoppingList"]

[ai]
binding = "AI"

[observability.logs]
enabled = false
invocation_logs = true

[assets]
directory = "./public"
binding = "ASSETS"

# Each branch Preview gets its own ShoppingList namespace and storage.
[previews.ai]
binding = "AI"

[[previews.durable_objects.bindings]]
name = "SHOPPING_LIST"
class_name = "ShoppingList"

# The older, fixed staging Worker remains available separately.
[env.preview]
name = "cf-ai-shopping-list-preview"

[env.preview.ai]
binding = "AI"

[env.preview.assets]
directory = "./public"
binding = "ASSETS"

[[env.preview.durable_objects.bindings]]
name = "SHOPPING_LIST"
class_name = "ShoppingList"
script_name = "cf-ai-shopping-list-preview"

[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["ShoppingList"]
